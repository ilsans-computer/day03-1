<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 숨은 맛집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 시맨틱 토큰: 화면에는 원시 색 대신 이 토큰만 쓴다. */
  :root {
    --fg: #1B1D22;
    --fg-secondary: #4D5159;
    --fg-disabled: #C9CCD2;
    --fg-on-accent: #FFFFFF;
    --bg: #FFFFFF;
    --bg-subtle: #F4F5F7;
    --bg-muted: #EAEBEE;
    --border: #E0E2E6;
    --border-strong: #C9CCD2;
    --accent: #5055B1;
    --accent-press: #3F4391;
    --negative: #EC1F2D;
    --shadow-soft: 0 5px 10px rgba(0, 0, 0, .10);
    --font: "Noto Sans KR", Roboto, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.01em;
    background: var(--bg-subtle);
    color: var(--fg);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 24px; line-height: 34px; font-weight: 700; color: var(--fg); }
  .sub { margin: 0 0 24px; color: var(--fg-secondary); font-size: 14px; line-height: 22px; }
  form, .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card { padding: 16px 20px; }
  label { display: block; margin-bottom: 16px; font-size: 14px; line-height: 22px; font-weight: 500; }
  input, select, textarea {
    display: block;
    width: 100%;
    height: 44px;
    margin-top: 8px;
    padding: 0 12px;
    font: inherit;
    font-weight: 400;
    letter-spacing: inherit;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }
  input::placeholder, textarea::placeholder { color: var(--fg-secondary); opacity: .6; }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
  }
  textarea { height: auto; min-height: 84px; padding: 12px; resize: vertical; }
  .error { min-height: 22px; margin: 0 0 8px; color: var(--negative); font-size: 14px; line-height: 22px; }
  button { font-family: var(--font); letter-spacing: inherit; }
  /* button-primary: 한 영역에 하나의 주 행동 */
  button.add {
    width: 100%;
    height: 44px;
    font-size: 16px;
    font-weight: 700;
    color: var(--fg-on-accent);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button.add:hover, button.add:active { background: var(--accent-press); }
  /* button-secondary: 옅은 보더 + 중립 표면 */
  .ai-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  /* AI 모델 아이콘: 선택된 것만 색, 나머지는 회색 */
  .models { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .model {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    font-size: 12px;
    line-height: 18px;
    color: #80858E;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .model svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .model:hover { background: var(--bg-subtle); }
  .model[aria-checked="true"] { color: var(--accent); border-color: var(--accent); font-weight: 700; }
  .total { margin: 0 0 12px; font-size: 14px; line-height: 22px; font-weight: 500; color: var(--fg-secondary); }
  .total:empty { display: none; }
  #list.loading { opacity: .5; }
  button.ai {
    height: 38px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    cursor: pointer;
  }
  button.ai:hover { background: var(--bg-subtle); }
  button.ai:disabled, button.add:disabled { color: var(--fg-disabled); background: var(--bg-muted); border-color: var(--border); cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h2 { margin: 32px 0 12px; font-size: 18px; line-height: 28px; font-weight: 700; }
  #list { display: grid; gap: 12px; }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card h3 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 700; word-break: break-all; }
  .menu { margin: 0; color: var(--fg-secondary); font-size: 14px; line-height: 22px; word-break: break-all; }
  .rating { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-size: 14px; line-height: 22px; }
  .stars { color: var(--accent); letter-spacing: 2px; }
  .score { font-family: Roboto, var(--font); font-weight: 500; color: var(--fg); }
  .review {
    margin: 12px 0 0;
    padding: 12px;
    background: var(--bg-subtle);
    border-radius: 8px;
    font-size: 14px;
    line-height: 22px;
    word-break: break-all;
  }
  /* button-tertiary: 배경 없는 텍스트 형태 */
  .del {
    flex: none;
    height: 32px;
    padding: 0 8px;
    font-size: 14px;
    color: var(--fg-secondary);
    background: none;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .del:hover { background: var(--bg-muted); color: var(--fg); }
  .pager { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px; margin-top: 24px; }
  .pager:empty { display: none; }
  .pager button, .pager .gap {
    min-width: 40px;
    height: 40px;
    padding: 0 8px;
    font-size: 14px;
    border-radius: 8px;
  }
  .pager button {
    color: var(--fg-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .pager button:hover { background: var(--bg-subtle); }
  .pager button[aria-current="page"] { color: var(--fg-on-accent); background: var(--fg); border-color: var(--fg); font-weight: 700; }
  .pager button:disabled { color: var(--fg-disabled); background: var(--bg-muted); border-color: var(--border); cursor: default; }
  .pager .gap { display: inline-flex; align-items: center; justify-content: center; color: var(--fg-secondary); }
  .empty { text-align: center; color: var(--fg-secondary); font-size: 14px; padding: 32px 0; }
  .foot { margin: 32px 0 0; text-align: center; color: var(--fg-secondary); font-size: 12px; line-height: 18px; }
  @media (min-width: 641px) {
    h1 { font-size: 32px; line-height: 44px; }
  }
  /* PC: 왼쪽 입력란 / 오른쪽 맛집 카드 목록 */
  @media (min-width: 900px) {
    .wrap { max-width: 1080px; padding: 48px 32px 60px; }
    .layout {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    form { position: sticky; top: 24px; }
    #list { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    #list .empty { grid-column: 1 / -1; }
  }
  @media (max-width: 640px) {
    /* 모바일 입력 높이 50px */
    input, select { height: 50px; }
    button.add { height: 50px; }
    button.ai { height: 44px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>우리 동네 숨은 맛집</h1>
  <p class="sub">가본 맛집을 기록하고 동네 사람들과 함께 봐요.</p>

  <div class="layout">
  <form id="form" novalidate>
    <label>식당 이름 *
      <input id="name" maxlength="30" placeholder="예: 골목 칼국수" autocomplete="off">
    </label>
    <label>메뉴
      <input id="menu" maxlength="30" placeholder="예: 바지락 칼국수" autocomplete="off">
    </label>
    <label>별점 *
      <select id="rating">
        <option value="">선택하세요</option>
        <option value="5">★★★★★ (5)</option>
        <option value="4">★★★★☆ (4)</option>
        <option value="3">★★★☆☆ (3)</option>
        <option value="2">★★☆☆☆ (2)</option>
        <option value="1">★☆☆☆☆ (1)</option>
      </select>
    </label>
    <label>한줄평
      <textarea id="review" maxlength="100" placeholder="100자 이내"></textarea>
    </label>
    <div class="ai-row">
      <div class="models" id="models" role="radiogroup" aria-label="AI 모델 선택">
        <button type="button" class="model" role="radio" aria-checked="true" data-model="" title="자동: 되는 모델을 순서대로 시도해요">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-13.7 5.6"/><path d="M4 12a8 8 0 0 1 13.7-5.6"/><path d="M18 2.5v4h-4"/><path d="M6 21.5v-4h4"/></svg>
          <span>자동</span>
        </button>
        <button type="button" class="model" role="radio" aria-checked="false" data-model="nvidia/nemotron-3-ultra-550b-a55b:free" title="Nemotron 3 Ultra">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><circle cx="12" cy="12" r="2.5"/></svg>
          <span>Nemotron</span>
        </button>
        <button type="button" class="model" role="radio" aria-checked="false" data-model="google/gemma-4-26b-a4b-it:free" title="Gemma 4 26B">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 9-8 9-8-9z"/></svg>
          <span>Gemma 26B</span>
        </button>
        <button type="button" class="model" role="radio" aria-checked="false" data-model="google/gemma-4-31b-it:free" title="Gemma 4 31B">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12l3 5-9 11L3 9z"/><path d="M3 9h18"/><path d="M9 4l3 5 3-5"/><path d="M12 9v11"/></svg>
          <span>Gemma 31B</span>
        </button>
      </div>
      <button type="button" class="ai" id="ai">AI 한줄평 추천</button>
    </div>
    <p class="error" id="error" role="alert"></p>
    <button type="submit" class="add">추가</button>
  </form>

  <section class="list-col">
    <p class="total" id="total" aria-live="polite"></p>
    <div id="list"></div>
    <nav id="pager" class="pager" aria-label="페이지 이동"></nav>
  </section>
  </div>
  <p class="foot">시각 디자인은 Kyobo Design System의 시각 언어를 참고했어요.</p>
</div>

<script>
  // Supabase 공개(publishable) 키: 브라우저에 노출돼도 되는 키이며, 접근은 RLS가 제한한다.
  var SUPABASE_URL = "https://afhohlawvswuvrqgaghg.supabase.co";
  var SUPABASE_KEY = "sb_publishable_2b-Mf80Ja1cUxl3W3mOULA_wnNM4xTA";
  var TABLE = SUPABASE_URL + "/rest/v1/restaurants";
  var HEADERS = {
    apikey: SUPABASE_KEY,
    Authorization: "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };
  var $ = function (id) { return document.getElementById(id); };

  function request(url, options) {
    return fetch(url, options).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.status === 204 ? null : res.json();
    });
  }

  // 데이터 접근 계층: UI는 이 네 함수만 사용한다.
  // 한 페이지 분량만 서버에서 가져오고, 전체 개수는 Content-Range 헤더("0-7/200004")에서 읽는다.
  function loadPage(pageNo, size) {
    var url = TABLE + "?select=*&order=created_at.desc,id.desc&limit=" + size + "&offset=" + (pageNo - 1) * size;
    return fetch(url, { headers: Object.assign({ Prefer: "count=exact" }, HEADERS) }).then(function (res) {
      // 범위를 벗어난 페이지(416)도 전체 개수는 헤더로 돌려준다.
      if (!res.ok && res.status !== 416) throw new Error("HTTP " + res.status);
      var m = /\/(\d+)$/.exec(res.headers.get("Content-Range") || "");
      var total = m ? Number(m[1]) : 0;
      var rows = res.ok ? res.json() : Promise.resolve([]);
      return rows.then(function (r) { return { rows: r, total: total }; });
    });
  }
  function addItem(item) {
    return request(TABLE, {
      method: "POST",
      headers: Object.assign({ Prefer: "return=representation" }, HEADERS),
      body: JSON.stringify(item)
    }).then(function (rows) { return rows[0]; });
  }
  function removeItem(id) {
    return request(TABLE + "?id=eq." + encodeURIComponent(id), { method: "DELETE", headers: HEADERS });
  }

  function suggestReview(item) {
    return request(SUPABASE_URL + "/functions/v1/suggest-review", {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify(item)
    }).then(function (data) { return data.review; });
  }

  var items = [];   // 현재 페이지의 맛집
  var total = 0;    // 전체 맛집 수(서버 기준)
  var loaded = false;
  var page = 1;
  var loadToken = 0;

  var wideQuery = window.matchMedia("(min-width: 900px)");
  // PC는 카드 2열 x 4행, 모바일은 1열 x 6개.
  function pageSize() { return wideQuery.matches ? 8 : 6; }

  // 현재 페이지를 서버에서 불러와 그린다. 오래된 응답은 버린다.
  function load() {
    var token = ++loadToken;
    var size = pageSize();
    $("list").classList.add("loading");
    return loadPage(page, size).then(function (r) {
      if (token !== loadToken) return;
      var pages = Math.max(1, Math.ceil(r.total / size));
      if (page > pages) { page = pages; return load(); } // 삭제로 비게 된 페이지는 앞 페이지로
      items = r.rows;
      total = r.total;
      loaded = true;
      render();
    }).catch(function () {
      if (token !== loadToken) return;
      loaded = true;
      render();
      $("error").textContent = "목록을 불러오지 못했어요. 새로고침해 주세요.";
    });
  }

  // 1 … 4 5 6 … 10 형태로 보여 줄 번호 목록을 만든다. 페이지가 아주 많아도 몇 개만 계산한다.
  function pageNumbers(totalPages, current) {
    var picked = {};
    [1, current - 1, current, current + 1, totalPages].forEach(function (p) {
      if (p >= 1 && p <= totalPages) picked[p] = true;
    });
    var nums = [];
    var prev = 0;
    Object.keys(picked).map(Number).sort(function (a, b) { return a - b; }).forEach(function (p) {
      if (p - prev === 2) nums.push(prev + 1);
      else if (p - prev > 2) nums.push("…");
      nums.push(p);
      prev = p;
    });
    return nums;
  }

  function goToPage(p) {
    page = p;
    load();
    var top = document.querySelector(".list-col").getBoundingClientRect().top;
    if (top < 0) document.querySelector(".list-col").scrollIntoView({ block: "start" });
  }

  function pagerButton(label, onClick, options) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if (options && options.disabled) b.disabled = true;
    if (options && options.current) b.setAttribute("aria-current", "page");
    if (options && options.aria) b.setAttribute("aria-label", options.aria);
    b.addEventListener("click", onClick);
    return b;
  }

  function renderPager(totalPages) {
    var pager = $("pager");
    pager.textContent = "";
    if (totalPages <= 1) return;
    pager.appendChild(pagerButton("이전", function () { goToPage(page - 1); }, { disabled: page === 1 }));
    pageNumbers(totalPages, page).forEach(function (n) {
      if (n === "…") {
        var gap = document.createElement("span");
        gap.className = "gap";
        gap.textContent = "…";
        pager.appendChild(gap);
      } else {
        pager.appendChild(pagerButton(String(n), function () { goToPage(n); },
          { current: n === page, aria: n + "페이지" }));
      }
    });
    pager.appendChild(pagerButton("다음", function () { goToPage(page + 1); }, { disabled: page === totalPages }));
  }

  function render() {
    var list = $("list");
    list.textContent = "";
    list.classList.remove("loading");
    $("total").textContent = loaded ? "총 " + total.toLocaleString("ko-KR") + "개" : "";
    if (!items.length) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = loaded ? "아직 등록된 맛집이 없어요." : "불러오는 중...";
      list.appendChild(empty);
      renderPager(0);
      return;
    }
    var totalPages = Math.max(1, Math.ceil(total / pageSize()));
    items.forEach(function (it) {
      var card = document.createElement("div");
      card.className = "card";

      var top = document.createElement("div");
      top.className = "top";
      var h = document.createElement("h3");
      h.textContent = it.name;
      var del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.textContent = "삭제";
      del.addEventListener("click", function () {
        del.disabled = true;
        removeItem(it.id).then(function () {
          return load(); // 개수와 페이지를 서버 기준으로 다시 맞춘다.
        }).catch(function () {
          del.disabled = false;
          $("error").textContent = "삭제하지 못했어요. 잠시 후 다시 시도해 주세요.";
        });
      });
      top.appendChild(h);
      top.appendChild(del);
      card.appendChild(top);

      if (it.menu) {
        var m = document.createElement("p");
        m.className = "menu";
        m.textContent = it.menu;
        card.appendChild(m);
      }
      // 의미를 색에만 의존하지 않도록 별과 함께 점수 텍스트를 병기한다.
      var s = document.createElement("p");
      s.className = "rating";
      var stars = document.createElement("span");
      stars.className = "stars";
      stars.setAttribute("aria-hidden", "true");
      stars.textContent = "★".repeat(it.rating) + "☆".repeat(5 - it.rating);
      var score = document.createElement("span");
      score.className = "score";
      score.textContent = "별점 " + it.rating + "점";
      s.appendChild(stars);
      s.appendChild(score);
      card.appendChild(s);

      if (it.review) {
        var r = document.createElement("p");
        r.className = "review";
        r.textContent = it.review;
        card.appendChild(r);
      }
      list.appendChild(card);
    });
    renderPager(totalPages);
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("name").value.trim();
    var menu = $("menu").value.trim();
    var rating = Number($("rating").value);
    var review = $("review").value.trim();
    var err = $("error");

    if (!name) { err.textContent = "식당 이름을 입력해 주세요."; return; }
    if (name.length > 30) { err.textContent = "식당 이름은 30자 이하로 써 주세요."; return; }
    if (menu.length > 30) { err.textContent = "메뉴는 30자 이하로 써 주세요."; return; }
    if (!(rating >= 1 && rating <= 5)) { err.textContent = "별점을 선택해 주세요."; return; }
    if (review.length > 100) { err.textContent = "한줄평은 100자 이하로 써 주세요."; return; }

    err.textContent = "";
    var btn = e.target.querySelector("button.add");
    btn.disabled = true;
    addItem({ name: name, menu: menu, rating: rating, review: review })
      .then(function () {
        page = 1; // 새 기록은 맨 위(1페이지)에 보인다.
        $("form").reset();
        $("name").focus();
        return load();
      })
      .catch(function () {
        err.textContent = "추가하지 못했어요. 잠시 후 다시 시도해 주세요.";
      })
      .then(function () { btn.disabled = false; });
  });

  $("ai").addEventListener("click", function () {
    var name = $("name").value.trim();
    var rating = Number($("rating").value);
    var err = $("error");
    if (!name) { err.textContent = "AI 추천을 받으려면 식당 이름을 먼저 입력해 주세요."; return; }
    if (!(rating >= 1 && rating <= 5)) { err.textContent = "AI 추천을 받으려면 별점을 먼저 선택해 주세요."; return; }

    err.textContent = "";
    var btn = $("ai");
    btn.disabled = true;
    btn.textContent = "추천 중...";
    suggestReview({ name: name, menu: $("menu").value.trim(), rating: rating, model: selectedModel })
      .then(function (text) { $("review").value = text; })
      .catch(function () { err.textContent = "AI 추천을 받지 못했어요. 잠시 후 다시 시도해 주세요."; })
      .then(function () {
        btn.disabled = false;
        btn.textContent = "AI 한줄평 추천";
      });
  });

  // AI 모델 아이콘: 눌러서 선택하고, 선택된 것만 색이 켜진다. 빈 값은 자동.
  var selectedModel = "";
  $("models").addEventListener("click", function (e) {
    var btn = e.target.closest(".model");
    if (!btn) return;
    selectedModel = btn.getAttribute("data-model");
    Array.prototype.forEach.call($("models").querySelectorAll(".model"), function (m) {
      m.setAttribute("aria-checked", m === btn ? "true" : "false");
    });
  });

  // 화면 크기가 바뀌어 한 페이지 개수가 달라지면 1페이지부터 다시 불러온다.
  wideQuery.addEventListener("change", function () { page = 1; load(); });
  render();
  load();
</script>
</body>
</html>
